<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DocuFlow AWS logo</title>
  <desc id="desc">Modern logo for DocuFlow AWS Smart Documents with document, cloud and workflow icon.</desc>
  <defs>
    <linearGradient id="blueGrad" x1="218" y1="74" x2="366" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#1777F2"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="106" y1="58" x2="329" y2="301" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="42" y1="222" x2="205" y2="333" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="1200" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .wordmark { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; letter-spacing: -0.04em; }
      .tagline { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 500; letter-spacing: 0.12em; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="transparent"/>

  <g transform="translate(72 54)" filter="url(#softShadow)">
    <!-- Document body -->
    <path d="M103 20H252L335 103V291C335 303.703 324.703 314 312 314H103C90.2975 314 80 303.703 80 291V43C80 30.2975 90.2975 20 103 20Z" fill="white" stroke="url(#slateGrad)" stroke-width="14" stroke-linejoin="round"/>

    <!-- Folded page corner -->
    <path d="M252 20L335 103H278C263.641 103 252 91.3594 252 77V20Z" fill="url(#blueGrad)"/>
    <path d="M252 20V78C252 91.8071 263.193 103 277 103H335" stroke="#1D4ED8" stroke-opacity="0.18" stroke-width="2"/>

    <!-- Text lines on document -->
    <rect x="123" y="106" width="80" height="13" rx="6.5" fill="#CBD5E1"/>
    <rect x="123" y="142" width="100" height="13" rx="6.5" fill="#B7C4D7"/>

    <!-- Cloud outline -->
    <path d="M127.624 314H57.5C28.5051 314 5 290.495 5 261.5C5 235.042 24.5573 213.151 50.0012 209.503C58.7245 179.681 86.271 157.867 118.926 157.867C149.496 157.867 175.592 176.971 185.905 203.898C215.76 207.347 239 232.727 239 263.5C239 296.637 212.137 323.5 179 323.5H127.624V314Z" fill="white" stroke="url(#cloudGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Workflow line -->
    <path d="M138 207H207C230 207 248 225.5 248 248.5V260C248 277 262 291 279 291H319" stroke="url(#blueGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Workflow nodes -->
    <circle cx="136" cy="207" r="22" fill="url(#blueGrad)" stroke="white" stroke-width="9"/>
    <circle cx="248" cy="249" r="22" fill="url(#blueGrad)" stroke="white" stroke-width="9"/>
    <circle cx="319" cy="291" r="22" fill="url(#blueGrad)" stroke="white" stroke-width="9"/>

    <!-- Cloud dots -->
    <circle cx="88" cy="288" r="8" fill="#1777F2"/>
    <circle cx="121" cy="288" r="8" fill="#1777F2"/>
    <circle cx="154" cy="288" r="8" fill="#1777F2"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(450 146)">
    <text class="wordmark" x="0" y="0" font-size="88" fill="#0F172A">DocuFlow</text>
    <text class="wordmark" x="556" y="0" font-size="88" fill="#1777F2">AWS</text>
    <text class="tagline" x="4" y="82" font-size="42" fill="#64748B">Smart Documents</text>
  </g>
</svg>
